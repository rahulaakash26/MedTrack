name: Deploy to GitHub Pages (with config.js)

on:
  push:
    branches:
      - main
  # optional manual trigger:
  # workflow_dispatch:

permissions:
  contents: write  # required by actions that publish to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: install/build if your site needs a build step
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '18'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build site
      #   run: npm run build
      # If you build into a directory (e.g., 'dist'), set `publish_dir` below to './dist'

      - name: Prepare publish directory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Create a clean publish directory and copy site files
          rm -rf publish || true
          mkdir publish
          rsync -a --delete \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='publish' \
            --exclude='config/config.js' \
            --exclude='REORGANIZATION_COMPLETE.md' \
            ./ publish/

          # Ensure config directory exists
          mkdir -p publish/config

          # Write config.js into publish/config/ directory
          cat > publish/config/config.js << 'CONFIGEOF'
          window.MEDTRACK_CONFIG = {
            SUPABASE_URL: 'REPLACE_SUPABASE_URL',
            SUPABASE_ANON_KEY: 'REPLACE_SUPABASE_ANON_KEY'
          };
          CONFIGEOF
          
          # Replace placeholder variables with actual values
          sed -i "s|REPLACE_SUPABASE_URL|$SUPABASE_URL|g" publish/config/config.js
          sed -i "s|REPLACE_SUPABASE_ANON_KEY|$SUPABASE_ANON_KEY|g" publish/config/config.js

      - name: Show publish directory contents for debugging
        run: |
          echo "=== Publish directory structure ==="
          ls -la publish/
          echo ""
          echo "=== Config directory ==="
          ls -la publish/config/ || echo "Config directory not found!"
          echo ""
          echo "=== Assets directory ==="
          ls -la publish/assets/ || echo "Assets directory not found!"
          echo ""
          echo "=== Auth directory ==="
          ls -la publish/auth/ || echo "Auth directory not found!"
          echo ""
          echo "=== Config file content (first 3 lines) ==="
          head -n 3 publish/config/config.js || echo "Config file not found!"
          echo ""
          echo "=== Verifying SUPABASE_URL is set ==="
          if grep -q "SUPABASE_URL: 'https://" publish/config/config.js; then
            echo "✓ SUPABASE_URL properly replaced with actual URL"
          elif grep -q "REPLACE_SUPABASE_URL" publish/config/config.js; then
            echo "✗ ERROR: SUPABASE_URL not replaced (still has placeholder)"
          else
            echo "⚠ WARNING: Could not verify SUPABASE_URL"
          fi

      - name: Debug git status in workspace
        run: |
          echo "Workspace git branches (remote):"
          git fetch --all --prune
          git branch -a || true
          echo "Last commit in workspace (for debug):"
          git --no-pager log -1 --pretty=oneline || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          # Optionally set user/email for the commit:
          # commit_user_name: github-actions[bot]
          # commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Verify deployment structure
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Verifying gh-pages branch structure ==="
          API_URL="https://api.github.com/repos/$REPO/git/trees/gh-pages?recursive=1"
          
          echo "Root files and directories:"
          curl -s -H "Authorization: token $TOKEN" "$API_URL" | jq -r '.tree[]?.path' | head -20 || echo "Failed to list tree"
          
          echo ""
          echo "✓ Checking for required directories:"
          curl -s -H "Authorization: token $TOKEN" "$API_URL" | jq -r '.tree[]?.path' | grep -E '^(config|assets|auth|docs)/' | head -10 || echo "Some directories might be missing"