name: Deploy to GitHub Pages (with config.js)

on:
  push:
    branches:
      - main
  # optional manual trigger:
  # workflow_dispatch:

permissions:
  contents: write  # required by actions that publish to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: install/build if your site needs a build step
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '18'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build site
      #   run: npm run build
      # If you build into a directory (e.g., 'dist'), set `publish_dir` below to './dist'

      - name: Prepare publish directory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Create a clean publish directory and copy site files
          rm -rf publish || true
          mkdir publish
          rsync -a --delete --exclude='.github' --exclude='.git' --exclude='node_modules' --exclude='publish' ./ publish/

          # Write config.js into publish dir
          cat > publish/config.js <<EOF
          window.MEDTRACK_CONFIG = {
            SUPABASE_URL: '$SUPABASE_URL',
            SUPABASE_ANON_KEY: '$SUPABASE_ANON_KEY'
          };
          EOF

      - name: Show publish directory contents for debugging
        run: |
          echo "Publish directory listing:"
          ls -la publish
          echo "config.js content (first line only):"
          head -n 1 publish/config.js || true

      - name: Debug git status in workspace
        run: |
          echo "Workspace git branches (remote):"
          git fetch --all --prune
          git branch -a || true
          echo "Last commit in workspace (for debug):"
          git --no-pager log -1 --pretty=oneline || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          # Optionally set user/email for the commit:
          # commit_user_name: github-actions[bot]
          # commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Verify gh-pages branch via GitHub API
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing root files in gh-pages via GitHub API"
          API_URL="https://api.github.com/repos/$REPO/git/trees/gh-pages?recursive=0"
          curl -s -H "Authorization: token $TOKEN" "$API_URL" | jq -r '.tree[]?.path' || echo "Failed to list tree"