<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Medicine Tracker</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💊 Medicine Tracker</h1>
                <p>Track your medicines and their expiry dates</p>
            </div>
            
            <form id="reset-form" class="auth-form">
                <h2>Reset Password</h2>
                <p class="form-description">Enter your email address and we'll send you a link to reset your password.</p>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="reset-btn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-loader" style="display: none;">Sending...</span>
                </button>
                
                <div class="auth-divider">
                    <span>Remember your password?</span>
                </div>
                
                <a href="login.html" class="btn-secondary btn-full">Back to Sign In</a>
            </form>
            
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script src="../config/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const authHandler = new AuthHandler();
        
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const resetBtn = document.getElementById('reset-btn');
            const btnText = resetBtn.querySelector('.btn-text');
            const btnLoader = resetBtn.querySelector('.btn-loader');
            
            // Show loading state
            resetBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.resetPassword(email);
            
            if (result.success) {
                authHandler.showMessage('Password reset link sent! Please check your email.', 'success');
                document.getElementById('reset-form').reset();
            } else {
                authHandler.showMessage(result.error, 'error');
            }
            
            resetBtn.disabled = false;
            btnText.style.display = 'inline';
            btnLoader.style.display = 'none';
        });
    </script>
</body>
</html>
