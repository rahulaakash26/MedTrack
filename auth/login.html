<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Medicine Tracker</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth-style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💊 Medicine Tracker</h1>
                <p>Track your medicines and their expiry dates</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                
                <div class="form-actions">
                    <a href="reset-password.html" class="link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display: none;">Signing in...</span>
                </button>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <button type="button" class="btn-google btn-full" id="google-signin-btn">
                    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span class="btn-text">Continue with Google</span>
                    <span class="btn-loader" style="display: none;">Connecting...</span>
                </button>
                
                <button type="button" class="btn-phone btn-full" id="phone-signin-btn">
                    <span class="phone-icon">📱</span>
                    <span class="btn-text">Continue with Phone</span>
                </button>
                
                <div class="auth-divider">
                    <span>Don't have an account?</span>
                </div>
                
                <a href="signup.html" class="btn-secondary btn-full">Create Account</a>
            </form>
            
            <!-- Phone Authentication Section (Hidden by default, outside form) -->
            <div id="phone-auth-section" class="phone-auth-section" style="display: none;">
                <h2>Phone Sign In</h2>
                <button type="button" class="btn-back" id="back-to-email-btn">
                    ← Back to email login
                </button>
                
                <div id="phone-input-section">
                    <div class="form-group">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" id="phone-number" placeholder="+1234567890" required>
                        <small class="form-hint">Enter with country code (e.g., +1 for US)</small>
                    </div>
                    <button type="button" class="btn-primary btn-full" id="send-otp-btn">
                        <span class="btn-text">Send OTP</span>
                        <span class="btn-loader" style="display: none;">Sending...</span>
                    </button>
                </div>
                
                <div id="otp-verify-section" style="display: none;">
                    <p class="otp-sent-message">OTP sent to <strong id="phone-display"></strong></p>
                    <div class="form-group">
                        <label for="otp-code">Enter OTP</label>
                        <input type="text" id="otp-code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required>
                    </div>
                    <button type="button" class="btn-primary btn-full" id="verify-otp-btn">
                        <span class="btn-text">Verify OTP</span>
                        <span class="btn-loader" style="display: none;">Verifying...</span>
                    </button>
                    <button type="button" class="btn-link" id="resend-otp-btn">Resend OTP</button>
                </div>
            </div>
            
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script src="../config/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const authHandler = new AuthHandler();
        
        // Check if already logged in
        authHandler.checkAuthAndRedirect();
        
        // Email/Password login handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoader = loginBtn.querySelector('.btn-loader');
            
            // Show loading state
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.login(email, password);
            
            if (result.success) {
                authHandler.showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } else {
                authHandler.showMessage(result.error, 'error');
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
        
        // Google sign-in handler
        document.getElementById('google-signin-btn').addEventListener('click', async () => {
            const googleBtn = document.getElementById('google-signin-btn');
            const btnText = googleBtn.querySelector('.btn-text');
            const btnLoader = googleBtn.querySelector('.btn-loader');
            
            // Show loading state
            googleBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.signInWithGoogle();
            
            // Note: If successful, the page will redirect to Google before we get here
            // This error handling is for cases where the redirect fails
            if (!result.success) {
                authHandler.showMessage(result.error, 'error');
                googleBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
        
        // Phone authentication handlers
        let currentPhoneNumber = '';
        
        // Show phone auth section
        document.getElementById('phone-signin-btn').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('phone-auth-section').style.display = 'block';
            document.getElementById('phone-number').focus();
        });
        
        // Back to email login
        document.getElementById('back-to-email-btn').addEventListener('click', () => {
            document.getElementById('phone-auth-section').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            // Reset phone auth section
            document.getElementById('phone-input-section').style.display = 'block';
            document.getElementById('otp-verify-section').style.display = 'none';
            document.getElementById('phone-number').value = '';
            document.getElementById('otp-code').value = '';
            currentPhoneNumber = '';
        });
        
        // Send OTP
        document.getElementById('send-otp-btn').addEventListener('click', async () => {
            const phoneNumber = document.getElementById('phone-number').value;
            const sendOtpBtn = document.getElementById('send-otp-btn');
            const btnText = sendOtpBtn.querySelector('.btn-text');
            const btnLoader = sendOtpBtn.querySelector('.btn-loader');
            
            if (!phoneNumber) {
                authHandler.showMessage('Please enter a phone number', 'error');
                return;
            }
            
            // Show loading state
            sendOtpBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.signInWithPhone(phoneNumber);
            
            if (result.success) {
                currentPhoneNumber = result.phone;
                document.getElementById('phone-display').textContent = result.phone;
                document.getElementById('phone-input-section').style.display = 'none';
                document.getElementById('otp-verify-section').style.display = 'block';
                document.getElementById('otp-code').focus();
                authHandler.showMessage('OTP sent successfully!', 'success');
            } else {
                authHandler.showMessage(result.error, 'error');
            }
            
            // Reset button state
            sendOtpBtn.disabled = false;
            btnText.style.display = 'inline';
            btnLoader.style.display = 'none';
        });
        
        // Verify OTP
        document.getElementById('verify-otp-btn').addEventListener('click', async () => {
            const otpCode = document.getElementById('otp-code').value;
            const verifyBtn = document.getElementById('verify-otp-btn');
            const btnText = verifyBtn.querySelector('.btn-text');
            const btnLoader = verifyBtn.querySelector('.btn-loader');
            
            if (!otpCode) {
                authHandler.showMessage('Please enter the OTP code', 'error');
                return;
            }
            
            // Show loading state
            verifyBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.verifyPhoneOtp(currentPhoneNumber, otpCode);
            
            if (result.success) {
                authHandler.showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } else {
                authHandler.showMessage(result.error, 'error');
                verifyBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
        
        // Resend OTP
        document.getElementById('resend-otp-btn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';
            
            const result = await authHandler.signInWithPhone(currentPhoneNumber);
            
            if (result.success) {
                authHandler.showMessage('OTP resent successfully!', 'success');
                document.getElementById('otp-code').value = '';
                document.getElementById('otp-code').focus();
            } else {
                authHandler.showMessage(result.error, 'error');
            }
            
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend OTP';
        });
    </script>
</body>
</html>
