<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Medicine Tracker</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💊 Medicine Tracker</h1>
                <p>Track your medicines and their expiry dates</p>
            </div>
            
            <form id="signup-form" class="auth-form">
                <h2>Create Account</h2>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="6">
                    <small class="form-hint">At least 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6">
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader" style="display: none;">Creating account...</span>
                </button>
                
                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>
                
                <a href="login.html" class="btn-secondary btn-full">Sign In</a>
            </form>
            
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script src="../config/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const authHandler = new AuthHandler();
        
        // Check if already logged in
        authHandler.checkAuthAndRedirect();
        
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const signupBtn = document.getElementById('signup-btn');
            const btnText = signupBtn.querySelector('.btn-text');
            const btnLoader = signupBtn.querySelector('.btn-loader');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                authHandler.showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                authHandler.showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Show loading state
            signupBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.signup(email, password);
            
            if (result.success) {
                authHandler.showMessage('Account created! Please check your email to verify your account.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                authHandler.showMessage(result.error, 'error');
                signupBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
