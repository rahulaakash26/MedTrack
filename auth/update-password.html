<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Medicine Tracker</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth-style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💊 Medicine Tracker</h1>
                <p>Track your medicines and their expiry dates</p>
            </div>
            
            <form id="update-password-form" class="auth-form">
                <h2>Update Password</h2>
                <p class="form-description">Enter your new password below.</p>
                
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="6">
                    <small class="form-hint">At least 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6">
                </div>
                
                <button type="submit" class="btn-primary btn-full" id="update-btn">
                    <span class="btn-text">Update Password</span>
                    <span class="btn-loader" style="display: none;">Updating...</span>
                </button>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <a href="login.html" class="btn-secondary btn-full">Back to Sign In</a>
            </form>
            
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script src="../config/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const authHandler = new AuthHandler();
        
        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const updateBtn = document.getElementById('update-btn');
            const btnText = updateBtn.querySelector('.btn-text');
            const btnLoader = updateBtn.querySelector('.btn-loader');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                authHandler.showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                authHandler.showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Show loading state
            updateBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            const result = await authHandler.updatePassword(password);
            
            if (result.success) {
                authHandler.showMessage('Password updated successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 2000);
            } else {
                authHandler.showMessage(result.error, 'error');
                updateBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
